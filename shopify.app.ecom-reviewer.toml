# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fa35c84d388af547e3cf332b3439d0ff"
name = "ReviewLift"
application_url = "https://ecom-review-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_files,read_orders,write_customers,write_discounts,write_files,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://ecom-review-app.onrender.com/api/auth" ]

[app_proxy]
url = "https://ecom-review-app.onrender.com/api/reviews"
subpath = "reviews"
prefix = "apps"
